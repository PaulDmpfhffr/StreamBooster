version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: streambooster-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-streambooster}
      MYSQL_USER: ${MYSQL_USER:-sbuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sbpassword}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: streambooster-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-redispassword}', 'ping']
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
